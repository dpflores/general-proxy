networks:
  proxy-net:
    name: apps-proxy-network

services:
  nginx-proxy:
    image: jwilder/nginx-proxy:1.7
    restart: always
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:rw
      - /etc/nginx/vhost.d
      - /usr/share/nginx/html
      - ./proxy/my-proxy.conf:/etc/nginx/conf.d/my-proxy.conf:ro
    labels:
      - com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy
    networks:
      - proxy-net

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:2.5
    restart: always

    volumes:
      - ./certs:/etc/nginx/certs:rw
      - ./acme/acme.sh:/etc/acme.sh:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    volumes_from:
      - nginx-proxy:rw
    networks:
      - proxy-net
